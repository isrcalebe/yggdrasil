services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: yggdrasil
      POSTGRES_USER: yggdrasil
      POSTGRES_PASSWORD: yggdrasil
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yggdrasil -d yggdrasil"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
